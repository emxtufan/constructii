            document.getElementById('gt-boot-retry').addEventListener('click', function() { location.reload(); });
            setTimeout(function() {
                var status = document.getElementById('gt-boot-status');
                if (!status) return;
                status.textContent = 'Încărcarea durează mai mult. Poți reîncărca pagina.';
                document.getElementById('gt-boot-retry').hidden = false;
            }, 20000);
        </script>
